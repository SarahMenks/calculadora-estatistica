name: C++ Multi-OS & Standard CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        cpp_std: [17, 20]

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Compilar e Executar Testes (Ubuntu / macOS)
      if: runner.os != 'Windows'
      run: make CXXFLAGS="-std=c++${{ matrix.cpp_std }} -Wall -Wextra"

    - name: Configurar ambiente MSVC
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Compilar e Executar Testes (Windows MSVC)
      if: runner.os == 'Windows'
      run: |
        cl /EHsc /std:c++${{ matrix.cpp_std }} estatistica.cpp testes.cpp /Fe:executavel_testes.exe
        .\executavel_testes.exe
